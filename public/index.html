<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Comida</title>
  <meta name="description" content="Recetas de la semana, lista de la compra, despensa y precios.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Comida">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>

  <main id="view" class="view" aria-live="polite"></main>

  <nav id="tabbar" class="tabbar" aria-label="Secciones">
    <button data-tab="semana"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Semana</span></button>
    <button data-tab="recetas"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg><span>Recetas</span></button>
    <button data-tab="compra"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg><span>Compra</span><b class="badge" id="badge-compra" hidden></b></button>
    <button data-tab="despensa"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 12h16M9 7.5h6M9 16.5h6"/></svg><span>Despensa</span></button>
    <button data-tab="ahorro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 8.5a3.5 3.5 0 0 0-3-1.5c-2 0-3 1-3 2.3 0 3.2 6 1.6 6 4.9 0 1.3-1.2 2.3-3 2.3a3.8 3.8 0 0 1-3.2-1.6M12 5.5v1.5M12 17v1.5"/></svg><span>Ahorro</span></button>
  </nav>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>

  <div id="toast" class="toast" role="status" hidden></div>

  <template id="login-tpl">
    <div class="login">
      <div class="login-card">
        <img src="/icons/icon-192.png" alt="" width="72" height="72">
        <h1>Comida</h1>
        <p class="muted">Introduce la contraseña de casa</p>
        <form id="login-form">
          <input type="password" name="password" autocomplete="current-password" placeholder="Contraseña" required>
          <button class="btn primary block" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
